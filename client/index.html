<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RasoiAI — Cook Smarter, Eat Better</title>
    <meta name="description" content="AI-powered recipes personalized to your pantry, diet, and health goals." />
    <script>
      // Apply saved theme before React hydrates (prevent flash)
      try {
        const t = localStorage.getItem("rasoiai-theme");
        if (t === "dim" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
